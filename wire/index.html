  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function lenientParse(input) {
    let pos = 0;
    const str = input;

    function skipWs() {
      while (pos < str.length && /\s/.test(str[pos])) pos++;
    }

    function parseValue() {
      skipWs();
      if (pos >= str.length) throw new Error('Unexpected end');
      const ch = str[pos];
      if (ch === '{') return parseObject();
      if (ch === '[') return parseArray();
      if (ch === '"') return parseQuoted('"');
      if (ch === "'") return parseQuoted("'");
      const numMatch = /^-?\d+\.?\d*([eE][+-]?\d+)?/.exec(str.slice(pos));
      if (numMatch && numMatch[0].length > 0) {
        if (numMatch[0] !== '-' && numMatch[0] !== '-.') {
          pos += numMatch[0].length;
          return parseFloat(numMatch[0]);
        }
      }
      return parseUnquoted();
    }

    function parseObject() {
      pos++;
      const obj = {};
      skipWs();
      if (str[pos] === '}') {
        pos++;
        return obj;
      }
      while (true) {
        skipWs();
        let key;
        if (str[pos] === '"' || str[pos] === "'") {
          key = parseQuoted(str[pos]);
        } else {
          let end = pos;
          while (end < str.length && str[end] !== ':' && !/\s/.test(str[end])) end++;
          key = str.slice(pos, end).trim();
          if (!key) throw new Error('Empty key');
          pos = end;
        }
        skipWs();
        if (str[pos] !== ':') throw new Error('Expected : after key "' + key + '"');
        pos++;
        obj[key] = parseValue();
        skipWs();
        if (str[pos] === ',') {
          pos++;
          continue;
        }
        if (str[pos] === '}') {
          pos++;
          break;
        }
        if (pos >= str.length) break;
        throw new Error('Expected , or } at position ' + pos);
      }
      return obj;
    }

    function parseArray() {
      pos++;
      const arr = [];
      skipWs();
      if (str[pos] === ']') {
        pos++;
        return arr;
      }
      while (true) {
        arr.push(parseValue());
        skipWs();
        if (str[pos] === ',') {
          pos++;
          continue;
        }
        if (str[pos] === ']') {
          pos++;
          break;
        }
        if (pos >= str.length) break;
        throw new Error('Expected , or ] at position ' + pos);
      }
      return arr;
    }

    function parseQuoted(quote) {
      pos++;
      let result = '';
      while (pos < str.length && str[pos] !== quote) {
        if (str[pos] === '\\') {
          pos++;
          const esc = str[pos];
          if (esc === 'n') result += '\n';
          else if (esc === 't') result += '\t';
          else if (esc === 'r') result += '\r';
          else result += esc || '';
        } else {
          result += str[pos];
        }
        pos++;
      }
      pos++;
      return result;
    }

    function parseUnquoted() {
      let end = pos;
      while (end < str.length && str[end] !== ',' && str[end] !== '}' && str[end] !== ']' && str[end] !== ':') {
        end++;
      }
      let val = str.slice(pos, end).trim();
      pos = end;
      if (val === 'true') return true;
      if (val === 'false') return false;
      if (val === 'null') return null;
      if (val === 'undefined') return undefined;
      if (/^-?\d+\.?\d*$/.test(val) && val !== '-' && val !== '-.') return parseFloat(val);
      return val;
    }
    const result = parseValue();
    skipWs();
    if (pos < str.length) throw new Error('Trailing content at position ' + pos);
    return result;
  }

  function lenientParseValue(value) {
    if (typeof value !== 'string') return value;
    const t = value.trim();
    if (t === '') return '';
    if (t === 'true') return true;
    if (t === 'false') return false;
    if (t === 'null') return null;
    try {
      return JSON.parse(t);
    } catch {}
    try {
      return lenientParse(t);
    } catch (e) {
      console.warn('[Wire] lenient parse failed for value:', t, '— error:', e.message);
    }
    return t;
  }

  function renderMarkdown(text) {
    if (!text) return '';
    try {
      return marked.parse(text, {
        breaks: true,
        gfm: true
      });
    } catch {
      return escapeHtml(text);
    }
  }

  function refreshIcons() {
    lucide.createIcons();
  }

  function toast(message, type = 'info') {
    const container = $('toasts');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const iconName = type === 'error' ? 'alert-circle' : type === 'success' ? 'check' : 'info';
    t.innerHTML = `<i data-lucide="${iconName}"></i><span>${escapeHtml(message)}</span>`;
    container.appendChild(t);
    refreshIcons();
    setTimeout(() => {
      t.style.opacity = '0';
      setTimeout(() => t.remove(), 200);
    }, 3200);
  }

  function loadSettings() {
    const saved = localStorage.getItem('wire-settings');
    if (saved) {
      try {
        Object.assign(settings, JSON.parse(saved));
      } catch {}
    }
    $('endpoint-input').value = settings.endpoint;
    $('apikey-input').value = settings.apiKey;
    $('model-input').value = settings.model;
    $('vision-input').checked = settings.vision;
    $('model-display').textContent = settings.model;
    $('vision-status').textContent = settings.vision ? 'vision on' : 'vision off';
    $('status-text').textContent = settings.model || 'not connected';
    state.streamMode = settings.stream !== false;
    updateStreamToggleUI();
    state.sendOnEnter = settings.sendOnEnter !== false;
    updateEnterToggleUI();
  }

  function saveSettings() {
    settings.endpoint = $('endpoint-input').value.trim();
    settings.apiKey = $('apikey-input').value.trim();
    settings.model = $('model-input').value.trim();
    settings.vision = $('vision-input').checked;
    settings.stream = state.streamMode;
    settings.sendOnEnter = state.sendOnEnter;
    localStorage.setItem('wire-settings', JSON.stringify(settings));
    $('model-display').textContent = settings.model;
    $('vision-status').textContent = settings.vision ? 'vision on' : 'vision off';
    $('status-text').textContent = settings.model || 'not connected';
    updateConnectionIndicator();
    updateRequestPreview();
    toast('Connection saved', 'success');
  }

  function updateStreamToggleUI() {
    const toggle = $('stream-toggle');
    const label = $('stream-label');
    if (state.streamMode) {
      toggle.classList.add('active');
      label.textContent = 'streaming';
    } else {
      toggle.classList.remove('active');
      label.textContent = 'response';
    }
  }

  function toggleStreamMode() {
    state.streamMode = !state.streamMode;
    settings.stream = state.streamMode;
    localStorage.setItem('wire-settings', JSON.stringify(settings));
    updateStreamToggleUI();
    updateRequestPreview();
  }

  function updateEnterToggleUI() {
    const toggle = $('enter-toggle');
    const label = $('enter-toggle-label');
    if (state.sendOnEnter) {
      toggle.classList.add('active');
      label.textContent = 'Enter to send';
      toggle.title = 'Enter sends · Shift+Enter for new line (click to switch)';
    } else {
      toggle.classList.remove('active');
      label.textContent = 'Enter for new line';
      toggle.title = 'Enter inserts a new line · Ctrl/Cmd+Enter sends (click to switch)';
    }
  }

  function toggleEnterMode() {
    state.sendOnEnter = !state.sendOnEnter;
    settings.sendOnEnter = state.sendOnEnter;
    localStorage.setItem('wire-settings', JSON.stringify(settings));
    updateEnterToggleUI();
  }

  function updateConnectionIndicator() {
    const dot = $('status-dot');
    const text = $('status-text');
    dot.className = 'status-dot';
    if (state.connectionState === 'connected') {
      dot.classList.add('connected');
    } else if (state.connectionState === 'error') {
      dot.classList.add('error');
    } else if (settings.endpoint) {
      dot.classList.add('ready', 'pulsing');
    }
    text.textContent = state.connectionState === 'error' ? 'error' : (settings.model || 'not connected');
  }

  async function createChat() {
    const chat = await db.chats.add({
      title: 'New conversation',
      systemPrompt: 'You are a helpful assistant.',
      params: [{
        key: 'temperature',
        value: '0.7'
      }],
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
    await loadChatList();
    await selectChat(chat);
    closeSidebar();
  }
  async function loadChatList() {
    const chats = await db.chats.orderBy('updatedAt').reverse().toArray();
    const list = $('chat-list');
    if (chats.length === 0) {
      list.innerHTML = '<p class="empty-list">No conversations yet</p>';
      return;
    }
    list.innerHTML = chats.map(chat => `<div class="chat-item ${chat.id === state.currentChatId ? 'active' : ''}" data-id="${chat.id}"><span class="chat-item-title">${escapeHtml(chat.title)}</span><button class="chat-item-del" data-del-id="${chat.id}" aria-label="Delete conversation"><i data-lucide="trash-2"></i></button></div>`).join('');
    refreshIcons();
  }
  async function selectChat(id) {
    const chat = await db.chats.get(id);
    if (!chat) return;
    state.currentChatId = id;
    state.currentSystemPrompt = chat.systemPrompt || '';
    state.messages = await db.messages.where('chatId').equals(id).toArray();
    state.currentParams = chat.params || [];
    $('chat-title').textContent = chat.title;
    $('sysbar-text').textContent = chat.systemPrompt || 'No system prompt';
    $('sys-input').value = chat.systemPrompt || '';
    renderMessages();
    renderParams();
    updateRequestPreview();
    await loadChatList();
  }
  async function deleteChat(id) {
    await db.messages.where('chatId').equals(id).delete();
    await db.chats.delete(id);
    if (state.currentChatId === id) {
      state.currentChatId = null;
      state.messages = [];
      state.currentParams = [];
      state.currentSystemPrompt = '';
      $('chat-title').textContent = 'New conversation';
      $('sysbar-text').textContent = 'No system prompt';
      $('sys-input').value = '';
      renderMessages();
      renderParams();
      updateRequestPreview();
      const remaining = await db.chats.orderBy('updatedAt').reverse().toArray();
      if (remaining.length > 0) {
        await selectChat(remaining[0].id);
      } else {
        await createChat();
      }
    }
    await loadChatList();
    toast('Conversation deleted', 'success');
  }
  async function resetChat() {
    if (!state.currentChatId) return;
    await db.messages.where('chatId').equals(state.currentChatId).delete();
    state.messages = [];
    await db.chats.update(state.currentChatId, {
      title: 'New conversation',
      updatedAt: Date.now()
    });
    $('chat-title').textContent = 'New conversation';
    renderMessages();
    updateRequestPreview();
    await loadChatList();
    toast('Conversation reset', 'success');
  }

  function attachCodeCopyButton(pre) {
    if (!pre || pre.tagName !== 'PRE' || pre.querySelector('.code-copy-btn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy-btn';
    btn.dataset.action = 'copy-code';
    btn.setAttribute('aria-label', 'Copy code');
    btn.innerHTML = '<i data-lucide="copy"></i>';
    pre.appendChild(btn);
  }

  function renderMessages() {
    const container = $('messages');
    container.innerHTML = '';
    if (state.messages.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="terminal"></i></div><h2>Wire is ready</h2><p>Configure your endpoint, then send a message to see the raw request and response on the wire.</p><div class="empty-actions"><button class="btn-ghost" id="empty-config-btn"><i data-lucide="settings"></i><span>Connection settings</span></button></div></div>`;
      refreshIcons();
      bindEmptyConfigBtn();
      return;
    }
    container.innerHTML = state.messages.map(msg => createMessageHTML(msg)).join('');
    container.querySelectorAll('pre code').forEach(block => {
      try {
        hljs.highlightElement(block);
      } catch {}
      attachCodeCopyButton(block.parentElement);
    });
    refreshIcons();
    scrollToBottom();
  }

  function createMessageHTML(msg) {
    const isUser = msg.role === 'user';
    const isError = msg.isError;
    const roleClass = isError ? 'role-error' : (isUser ? 'role-user' : 'role-assistant');
    const roleLabel = isError ? 'error' : msg.role;
    let contentHTML;
    if (isUser && !isError) {
      contentHTML = escapeHtml(msg.content).replace(/\n/g, '<br>');
    } else {
      contentHTML = renderMarkdown(msg.content);
    }
    let imageHTML = '';
    if (msg.imageUrl) {
      imageHTML = `<img class="msg-image" src="${msg.imageUrl}" alt="Attached image">`;
    }
    let reasoningHTML = '';
    if (msg.reasoning) {
      reasoningHTML = `<div class="msg-reasoning"><button class="reasoning-toggle" data-reasoning-toggle><i data-lucide="brain"></i><span>reasoning</span><i data-lucide="chevron-down" class="chevron"></i></button><div class="reasoning-body"><div class="reasoning-text">${escapeHtml(msg.reasoning)}</div></div></div>`;
    }
    let rawErrorHTML = '';
    if (isError && msg.rawError) {
      rawErrorHTML = `<div class="msg-raw-error"><button class="raw-error-toggle" data-raw-error-toggle><i data-lucide="alert-triangle"></i><span>raw response</span><i data-lucide="chevron-down" class="chevron"></i></button><div class="raw-error-body"><div class="raw-error-text">${escapeHtml(msg.rawError)}</div></div></div>`;
    }
    let rawResponseHTML = '';
    if (!isError && msg.rawResponse) {
      rawResponseHTML = `<div class="msg-raw-response"><button class="raw-response-toggle" data-raw-response-toggle><i data-lucide="braces"></i><span>raw response</span><i data-lucide="chevron-down" class="chevron"></i></button><div class="raw-response-body"><div class="raw-response-text">${escapeHtml(msg.rawResponse)}</div></div></div>`;
    }
    const showActions = typeof msg.id === 'number';
    const regenBtn = (!isUser && showActions) ? `<button class="icon-btn sm" data-action="regen" data-msg-id="${msg.id}" aria-label="Regenerate"><i data-lucide="rotate-ccw"></i></button>` : '';
    const actions = showActions ? `<div class="msg-actions"><button class="icon-btn sm" data-action="copy" data-msg-id="${msg.id}" aria-label="Copy"><i data-lucide="copy"></i></button>${regenBtn}<button class="icon-btn sm" data-action="delete" data-msg-id="${msg.id}" aria-label="Delete"><i data-lucide="trash-2"></i></button></div>` : '';
    return `<div class="msg ${roleClass}" data-msg-id="${msg.id}"><div class="msg-head"><span class="msg-role">${roleLabel}</span>${actions}</div>${reasoningHTML}${rawErrorHTML}${rawResponseHTML}<div class="msg-content">${imageHTML}<div class="md-content">${contentHTML}</div></div></div>`;
  }

  function bindEmptyConfigBtn() {
    const btn = $('empty-config-btn');
    if (btn) btn.addEventListener('click', openSettings);
  }

  async function deleteMessage(msgId) {
    const idx = state.messages.findIndex(m => String(m.id) === String(msgId));
    if (idx < 0) return;
    state.messages.splice(idx, 1);
    if (typeof msgId === 'number') await db.messages.delete(msgId);
    renderMessages();
    updateRequestPreview();
  }
  async function regenerateMessage(msgId) {
    const idx = state.messages.findIndex(m => String(m.id) === String(msgId));
    if (idx < 0) return;
    const toRemove = state.messages.slice(idx);
    state.messages = state.messages.slice(0, idx);
    for (const msg of toRemove) {
      if (typeof msg.id === 'number') await db.messages.delete(msg.id);
    }
    const lastImageMsg = [...state.messages].reverse().find(m => m.imageUrl);
    if (lastImageMsg) {
      console.log('[Wire] regenerate: found last imageBase64 on msg', lastImageMsg.id, 'data length:', lastImageMsg.imageUrl.length, 'chars');
    } else {
      console.log('[Wire] regenerate: no imageBase64 found in remaining messages');
    }
    renderMessages();
    updateRequestPreview();
    await streamCompletion();
  }

  async function sendMessage() {
    const input = $('msg-input');
    const text = input.value.trim();
    if ((!text && !state.pendingImage) || state.isGenerating) return;
    if (!settings.endpoint) {
      toast('Set an API endpoint first', 'error');
      openSettings();
      return;
    }
    const userMsg = {
      chatId: state.currentChatId,
      role: 'user',
      content: text,
      imageUrl: state.pendingImage || null,
      timestamp: Date.now()
    };
    const id = await db.messages.add(userMsg);
    userMsg.id = id;
    state.messages.push(userMsg);
    if (state.pendingImage) {
      console.log('[Wire] image attached to msg', id, 'base64 length:', state.pendingImage.length);
    }
    input.value = '';
    autoResize(input);
    clearPendingImage();
    const chat = await db.chats.get(state.currentChatId);
    if (chat && chat.title === 'New conversation' && text) {
      const newTitle = text.substring(0, 42) + (text.length > 42 ? '…' : '');
      await db.chats.update(state.currentChatId, {
        title: newTitle,
        updatedAt: Date.now()
      });
      $('chat-title').textContent = newTitle;
      loadChatList();
    }
    await db.chats.update(state.currentChatId, {
      updatedAt: Date.now()
    });
    renderMessages();
    updateRequestPreview();
    await streamCompletion();
  }

  async function streamCompletion() {
    state.isGenerating = true;
    setGeneratingUI(true);
    const tempId = 'temp-' + Date.now();
    const placeholder = {
      id: tempId,
      role: 'assistant',
      content: '',
      reasoning: '',
      timestamp: Date.now()
    };
    state.messages.push(placeholder);
    renderMessages();
    const requestMessages = buildMessagesArray();
    const requestBody = buildRequestBody(requestMessages);
    const isStreaming = state.streamMode;
    let rawResponse = '';
    console.log('[Wire] request mode:', isStreaming ? 'stream (delta)' : 'response (full)', '| params:', Object.keys(requestBody).join(', '));
    try {
      state.abortController = new AbortController();
      const response = await fetch(settings.endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(settings.apiKey ? {
            'Authorization': `Bearer ${settings.apiKey}`
          } : {})
        },
        body: JSON.stringify(requestBody),
        signal: state.abortController.signal
      });
      if (!response.ok) {
        const errorText = await response.text();
        let errorMsg = `HTTP ${response.status} ${response.statusText}`;
        let rawError = errorText || null;
        try {
          const ej = JSON.parse(errorText);
          errorMsg = ej.error?.message || ej.error || ej.detail || errorMsg;
          rawError = JSON.stringify(ej, null, 2);
        } catch {
          if (errorText) errorMsg = errorText.substring(0, 300);
          rawError = errorText || null;
        }
        const err = new Error(errorMsg);
        err.rawError = rawError;
        throw err;
      }
      let fullContent = '';
      let fullReasoning = '';
      if (isStreaming && response.body) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const {
            done,
            value
          } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, {
            stream: true
          });
          buffer += chunk;
          rawResponse += chunk;
          let nlIdx;
          while ((nlIdx = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, nlIdx).trim();
            buffer = buffer.slice(nlIdx + 1);
            if (!line || line.startsWith(':')) continue;
            if (!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta;
              if (!delta) continue;
              const deltaContent = delta.content || '';
              const deltaReasoning = delta.reasoning_content || delta.reasoning || '';
              if (deltaContent) fullContent += deltaContent;
              if (deltaReasoning) fullReasoning += deltaReasoning;
              if (deltaContent || deltaReasoning) {
                placeholder.content = fullContent;
                placeholder.reasoning = fullReasoning;
                updateStreamingDOM(tempId, fullContent, fullReasoning);
              }
            } catch {}
          }
        }
      } else {
        const rawText = await response.text();
        rawResponse = rawText;
        try {
          const data = JSON.parse(rawText);
          const msg = data.choices?.[0]?.message;
          if (msg) {
            fullContent = msg.content || '';
            fullReasoning = msg.reasoning_content || msg.reasoning || '';
          } else {
            fullContent = data.choices?.[0]?.text || JSON.stringify(data, null, 2);
          }
        } catch {
          fullContent = rawText;
          console.warn('[Wire] response is not JSON, showing raw text');
        }
      }
      if (fullReasoning) {
        console.log('[Wire] reasoning detected, length:', fullReasoning.length, 'chars');
      }
      if (!fullContent.trim() && !fullReasoning.trim()) {
        fullContent = '*(Received empty response)*';
        console.warn('[Wire] empty response from API');
      }
      const assistantMsg = {
        chatId: state.currentChatId,
        role: 'assistant',
        content: fullContent,
        reasoning: fullReasoning || undefined,
        rawResponse: rawResponse || undefined,
        timestamp: Date.now()
      };
      const realId = await db.messages.add(assistantMsg);
      const idx = state.messages.findIndex(m => m.id === tempId);
      if (idx >= 0) {
        state.messages[idx] = {
          ...assistantMsg,
          id: realId
        };
      }
      state.connectionState = 'connected';
      updateConnectionIndicator();
      renderMessages();
      updateRequestPreview();
    } catch (error) {
      const idx = state.messages.findIndex(m => m.id === tempId);
      if (error.name === 'AbortError') {
        console.log('[Wire] generation stopped by user');
        if (idx >= 0 && (placeholder.content || placeholder.reasoning)) {
          const partial = {
            chatId: state.currentChatId,
            role: 'assistant',
            content: placeholder.content || '*(stopped)*',
            reasoning: placeholder.reasoning || undefined,
            rawResponse: rawResponse || undefined,
            timestamp: Date.now()
          };
          const realId = await db.messages.add(partial);
          state.messages[idx] = {
            ...partial,
            id: realId
          };
        } else if (idx >= 0) {
          state.messages.splice(idx, 1);
        }
        renderMessages();
        updateRequestPreview();
      } else {
        const errorRecord = {
          chatId: state.currentChatId,
          role: 'assistant',
          content: error.message,
          isError: true,
          timestamp: Date.now(),
          rawError: error.rawError || null
        };
        const realId = await db.messages.add(errorRecord);
        if (idx >= 0) {
          state.messages[idx] = {
            ...errorRecord,
            id: realId
          };
        }
        state.connectionState = 'error';
        updateConnectionIndicator();
        renderMessages();
        updateRequestPreview();
        console.error('[Wire] request error:', error.message);
        toast(error.message, 'error');
      }
    } finally {
      state.isGenerating = false;
      state.abortController = null;
      setGeneratingUI(false);
    }
  }

  function updateStreamingDOM(tempId, content, reasoning) {
    const msgEl = document.querySelector(`[data-msg-id="${tempId}"]`);
    if (!msgEl) return;
    if (reasoning) {
      let reasoningContainer = msgEl.querySelector('.msg-reasoning');
      if (!reasoningContainer) {
        reasoningContainer = document.createElement('div');
        reasoningContainer.className = 'msg-reasoning open';
        reasoningContainer.innerHTML = `<button class="reasoning-toggle" data-reasoning-toggle><i data-lucide="brain"></i><span>reasoning</span><i data-lucide="chevron-down" class="chevron"></i></button><div class="reasoning-body"><div class="reasoning-text"></div></div>`;
        const msgContent = msgEl.querySelector('.msg-content');
        if (msgContent) {
          msgContent.insertAdjacentElement('beforebegin', reasoningContainer);
        }
        refreshIcons();
      }
      const textEl = reasoningContainer.querySelector('.reasoning-text');
      if (textEl) textEl.textContent = reasoning;
    }
    if (content) {
      const contentEls = msgEl.querySelectorAll('.md-content');
      for (const el of contentEls) {
        if (!el.classList.contains('reasoning-text')) {
          el.innerHTML = marked.parse(content, {
            breaks: true,
            gfm: true
          }) + '<span class="streaming-cursor"></span>';
          el.querySelectorAll('pre').forEach(attachCodeCopyButton);
          refreshIcons();
          break;
        }
      }
    }
    scrollToBottom();
  }

  function stopGeneration() {
    if (state.abortController) {
      state.abortController.abort();
    }
  }

  function buildMessagesArray() {
    const messages = [];
    if (state.currentSystemPrompt) {
      messages.push({
        role: 'system',
        content: state.currentSystemPrompt
      });
    }
    for (const msg of state.messages) {
      if (typeof msg.id === 'string' && msg.id.startsWith('temp-')) continue;
      if (msg.isError) continue;
      if (!msg.content && !msg.imageUrl) continue;
      if (msg.imageUrl) {
        messages.push({
          role: msg.role,
          content: [{
            type: 'text',
            text: msg.content || 'What do you see in this image?'
          }, {
            type: 'image_url',
            image_url: {
              url: msg.imageUrl
            }
          }]
        });
      } else {
        messages.push({
          role: msg.role,
          content: msg.content
        });
      }
    }
    return messages;
  }

  function buildRequestBody(messages) {
    const body = {
      model: settings.model,
      messages: messages
    };
    if (state.streamMode) {
      body.stream = true;
    }
    for (const p of (state.currentParams || [])) {
      const key = (p.key || '').trim();
      if (!key) continue;
      if (key === 'stream') continue;
      if (key === 'model') continue;
      if (key === 'messages') continue;
      body[key] = lenientParseValue(p.value);
    }
    return body;
  }

  function updateRequestPreview() {
    const messages = buildMessagesArray();
    const body = buildRequestBody(messages);
    const paramsPreview = {
      ...body
    };
    delete paramsPreview.messages;
    $('inspector-code-params').textContent = JSON.stringify(paramsPreview, null, 2);
    const msgCount = messages.length;
    const msgJson = JSON.stringify(messages);
    const msgTokens = Math.ceil(msgJson.length / 4);
    $('inspector-msgs-meta').textContent = `${msgCount} item${msgCount !== 1 ? 's' : ''} · ~${msgTokens.toLocaleString()} tokens`;
    if (!$('inspector-msgs-pre').classList.contains('hidden')) {
      updateInspectorMsgs();
    }
    const totalJson = JSON.stringify(body);
    $('inspector-meta').textContent = `~${Math.ceil(totalJson.length / 4).toLocaleString()} tokens`;
  }

  function updateInspectorMsgs() {
    const messages = buildMessagesArray();
    const preview = JSON.parse(JSON.stringify(messages));
    for (const msg of preview) {
      if (Array.isArray(msg.content)) {
        for (const part of msg.content) {
          if (part.type === 'image_url' && part.image_url?.url) {
            part.image_url.url = part.image_url.url.substring(0, 50) + '…[base64]';
          }
        }
      }
    }
    $('inspector-code-msgs').textContent = JSON.stringify(preview, null, 2);
  }

  function renderParams() {
    const container = $('params-list');
    const params = state.currentParams || [];
    if (params.length === 0) {
      container.innerHTML = `<p class="params-empty">No additional parameters. <code>model</code> · <code>messages</code> · <code>stream</code> are built-in.<span class="params-hint">Values accept unquoted syntax: <code>{ type: enabled }</code> or bare <code>none</code> — no quotes needed.</span></p>`;
    } else {
      container.innerHTML = params.map((p, i) => `<div class="param-row" data-index="${i}"><input class="param-key" type="text" value="${escapeHtml(p.key)}" placeholder="key" spellcheck="false" data-index="${i}"><span class="param-sep">:</span><input class="param-value" type="text" value="${escapeHtml(p.value)}" placeholder="value" spellcheck="false" data-index="${i}" title="Type values without quotes: { type: enabled } or just none"><button class="icon-btn sm param-del" data-index="${i}" aria-label="Remove parameter"><i data-lucide="x"></i></button></div>`).join('');
    }
    $('params-count').textContent = params.length;
    refreshIcons();
    if (state._focusParamIndex !== undefined) {
      const inp = container.querySelector(`.param-key[data-index="${state._focusParamIndex}"]`);
      if (inp) {
        inp.focus();
        inp.select();
      }
      state._focusParamIndex = undefined;
    }
  }

  function addParam(key = '', value = '') {
    if (!state.currentParams) state.currentParams = [];
    state.currentParams.push({
      key,
      value
    });
    state._focusParamIndex = state.currentParams.length - 1;
    saveParams();
    renderParams();
    updateRequestPreview();
  }
  async function saveParams() {
    if (state.currentChatId) {
      await db.chats.update(state.currentChatId, {
        params: state.currentParams,
        updatedAt: Date.now()
      });
    }
  }

  function filterParams(query) {
    if (!query) return PARAM_CATALOG;
    const q = query.toLowerCase();
    return PARAM_CATALOG.filter(p => p.key.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
  }

  function highlightMatch(text, query) {
    if (!query) return escapeHtml(text);
    const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return escapeHtml(text).replace(re, '<mark>$1</mark>');
  }

  function renderSuggestions(query) {
    const paramSuggestions = $('param-suggestions');
    const filtered = filterParams(query);
    if (filtered.length === 0) {
      paramSuggestions.innerHTML = '<div class="param-suggestion-empty">no matches</div>';
      paramSuggestions.classList.remove('hidden');
      state.paramActiveIndex = -1;
      return;
    }
    paramSuggestions.innerHTML = filtered.map((p, i) => `<div class="param-suggestion-item${i === state.paramActiveIndex ? ' active' : ''}" data-index="${i}" data-key="${escapeHtml(p.key)}"><span class="param-suggestion-key">${highlightMatch(p.key, query)}</span><span class="param-suggestion-desc">${highlightMatch(p.desc, query)}</span></div>`).join('');
    paramSuggestions.classList.remove('hidden');
  }

  function selectSuggestion(key) {
    const entry = PARAM_CATALOG.find(p => p.key === key);
    if (entry) {
      addParam(entry.key, entry.defaultVal);
    }
    closePalette();
  }

  function openPalette() {
    state.paramPaletteOpen = true;
    state.paramActiveIndex = 0;
    renderSuggestions($('param-search').value);
    $('param-search').focus();
  }

  function closePalette() {
    state.paramPaletteOpen = false;
    state.paramActiveIndex = -1;
    $('param-suggestions').classList.add('hidden');
    $('param-search').value = '';
  }

  function toggleSysEditMode(editing) {
    $('sysbar-display').classList.toggle('hidden', editing);
    $('sysbar-edit').classList.toggle('hidden', !editing);
    if (editing) {
      $('sys-input').focus();
      $('sys-input').setSelectionRange($('sys-input').value.length, $('sys-input').value.length);
    }
  }
  async function saveSystemPrompt() {
    const text = $('sys-input').value.trim();
    state.currentSystemPrompt = text;
    $('sysbar-text').textContent = text || 'No system prompt';
    if (state.currentChatId) {
      await db.chats.update(state.currentChatId, {
        systemPrompt: text,
        updatedAt: Date.now()
      });
    }
    toggleSysEditMode(false);
    updateRequestPreview();
  }

  function handleImageUpload(file) {
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      toast('Image too large (max 4MB)', 'error');
      return;
    }
    if (!settings.vision) {
      toast('Vision not enabled — model may reject images', 'error');
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      state.pendingImage = e.target.result;
      $('image-thumb-img').src = e.target.result;
      $('image-thumb').classList.remove('hidden');
      updateSendButton();
    };
    reader.readAsDataURL(file);
  }

  function clearPendingImage() {
    state.pendingImage = null;
    $('image-thumb').classList.add('hidden');
    $('image-thumb-img').src = '';
    $('image-file').value = '';
    updateSendButton();
  }

  function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  }

  function updateSendButton() {
    const input = $('msg-input');
    $('send-btn').disabled = !input.value.trim() && !state.pendingImage;
  }

  function setGeneratingUI(on) {
    $('stop-btn').classList.toggle('hidden', !on);
    $('send-btn').classList.toggle('hidden', on);
    $('msg-input').disabled = on;
    var iconButtons = document.querySelectorAll('#image-btn, #reset-btn, #stream-toggle');
    if (on) {
      iconButtons.forEach(function(btn) {
        btn.style.opacity = '0.4';
        btn.style.pointerEvents = 'none';
      });
    } else {
      iconButtons.forEach(function(btn) {
        btn.style.opacity = '';
        btn.style.pointerEvents = '';
      });
      updateSendButton();
    }
  }

  function scrollToBottom() {
    const m = $('messages');
    m.scrollTop = m.scrollHeight;
  }

  function openSidebar() {
    $('sidebar').classList.add('open');
    $('overlay').classList.add('show');
  }

  function closeSidebar() {
    $('sidebar').classList.remove('open');
    if (!$('settings').classList.contains('open')) {
      $('overlay').classList.remove('show');
    }
  }

  function openSettings() {
    $('settings').classList.add('open');
    $('overlay').classList.add('show');
  }

  function closeSettings() {
    $('settings').classList.remove('open');
    if (!$('sidebar').classList.contains('open')) {
      $('overlay').classList.remove('show');
    }
  }

  function toggleInspector() {
    const body = $('inspector-body');
    const toggle = $('inspector-toggle');
    body.classList.toggle('hidden');
    toggle.classList.toggle('open');
    if (!body.classList.contains('hidden')) {
      updateRequestPreview();
    }
  }

  function toggleInspectorMsgs() {
    const pre = $('inspector-msgs-pre');
    const toggle = $('inspector-msgs-toggle');
    pre.classList.toggle('hidden');
    toggle.classList.toggle('open');
    state.inspectorMsgsOpen = !pre.classList.contains('hidden');
    if (state.inspectorMsgsOpen) {
      updateInspectorMsgs();
    }
  }

  function toggleParams() {
    const body = $('params-body');
    const toggle = $('params-toggle');
    body.classList.toggle('hidden');
    toggle.classList.toggle('open');
  }

  function setupEvents() {
    $('toggle-sidebar-btn').addEventListener('click', openSidebar);
    $('new-chat-btn').addEventListener('click', createChat);
    $('open-settings-btn').addEventListener('click', openSettings);
    $('open-settings-top').addEventListener('click', openSettings);
    $('close-settings-btn').addEventListener('click', closeSettings);
    $('save-settings-btn').addEventListener('click', saveSettings);
    $('overlay').addEventListener('click', () => {
      closeSidebar();
      closeSettings();
    });
    $('reset-btn').addEventListener('click', resetChat);
    $('stream-toggle').addEventListener('click', toggleStreamMode);
    $('enter-toggle').addEventListener('click', toggleEnterMode);
    $('edit-sys-btn').addEventListener('click', () => toggleSysEditMode(true));
    $('save-sys-btn').addEventListener('click', saveSystemPrompt);
    $('cancel-sys-btn').addEventListener('click', () => toggleSysEditMode(false));
    $('sys-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        saveSystemPrompt();
      }
    });
    $('inspector-toggle').addEventListener('click', toggleInspector);
    $('inspector-msgs-toggle').addEventListener('click', toggleInspectorMsgs);
    $('params-toggle').addEventListener('click', toggleParams);

    const paramSearch = $('param-search');
    const paramSuggestions = $('param-suggestions');
    paramSearch.addEventListener('focus', () => {
      if (!state.paramPaletteOpen) openPalette();
    });
    paramSearch.addEventListener('input', () => {
      state.paramActiveIndex = 0;
      renderSuggestions(paramSearch.value.trim());
    });
    paramSearch.addEventListener('keydown', (e) => {
      const filtered = filterParams(paramSearch.value.trim());
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.paramActiveIndex = Math.min(state.paramActiveIndex + 1, filtered.length - 1);
        renderSuggestions(paramSearch.value.trim());
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.paramActiveIndex = Math.max(state.paramActiveIndex - 1, 0);
        renderSuggestions(paramSearch.value.trim());
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (state.paramActiveIndex >= 0 && filtered[state.paramActiveIndex]) {
          selectSuggestion(filtered[state.paramActiveIndex].key);
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closePalette();
      }
    });
    paramSuggestions.addEventListener('click', (e) => {
      const item = e.target.closest('.param-suggestion-item');
      if (item) {
        selectSuggestion(item.dataset.key);
      }
    });
    document.addEventListener('click', (e) => {
      if (state.paramPaletteOpen && !$('param-palette').contains(e.target)) {
        closePalette();
      }
    });

    $('params-list').addEventListener('change', (e) => {
      const target = e.target;
      const i = parseInt(target.dataset.index);
      if (isNaN(i) || !state.currentParams[i]) return;
      if (target.classList.contains('param-key')) {
        state.currentParams[i].key = target.value.trim();
      } else if (target.classList.contains('param-value')) {
        state.currentParams[i].value = target.value;
      }
      saveParams();
      updateRequestPreview();
    });
    $('params-list').addEventListener('click', (e) => {
      const delBtn = e.target.closest('.param-del');
      if (!delBtn) return;
      const i = parseInt(delBtn.dataset.index);
      if (!isNaN(i)) {
        state.currentParams.splice(i, 1);
        saveParams();
        renderParams();
        updateRequestPreview();
      }
    });

    const input = $('msg-input');
    input.addEventListener('input', () => {
      autoResize(input);
      updateSendButton();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const shouldSend = state.sendOnEnter ? !e.shiftKey : (e.metaKey || e.ctrlKey);
      if (shouldSend) {
        e.preventDefault();
        if (!state.isGenerating) sendMessage();
      }
    });
    $('send-btn').addEventListener('click', sendMessage);
    $('stop-btn').addEventListener('click', stopGeneration);
    $('image-btn').addEventListener('click', () => $('image-file').click());
    $('image-file').addEventListener('change', (e) => {
      if (e.target.files[0]) handleImageUpload(e.target.files[0]);
    });
    $('image-remove').addEventListener('click', clearPendingImage);

    $('messages').addEventListener('click', async (e) => {
      const reasoningToggle = e.target.closest('[data-reasoning-toggle]');
      if (reasoningToggle) {
        const reasoningEl = reasoningToggle.closest('.msg-reasoning');
        if (reasoningEl) reasoningEl.classList.toggle('open');
        return;
      }
      const rawErrorToggle = e.target.closest('[data-raw-error-toggle]');
      if (rawErrorToggle) {
        const rawEl = rawErrorToggle.closest('.msg-raw-error');
        if (rawEl) rawEl.classList.toggle('open');
        return;
      }
      const rawResponseToggle = e.target.closest('[data-raw-response-toggle]');
      if (rawResponseToggle) {
        const rawRespEl = rawResponseToggle.closest('.msg-raw-response');
        if (rawRespEl) rawRespEl.classList.toggle('open');
        return;
      }
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const msgId = btn.dataset.msgId;
      const msg = state.messages.find(m => String(m.id) === String(msgId));
      if (action === 'copy' && msg) {
        try {
          await navigator.clipboard.writeText(msg.content);
          toast('Copied to clipboard', 'success');
        } catch {
          toast('Could not copy', 'error');
        }
      } else if (action === 'copy-code') {
        const codeEl = btn.closest('pre')?.querySelector('code');
        const codeText = codeEl ? codeEl.textContent : '';
        try {
          await navigator.clipboard.writeText(codeText);
          btn.classList.add('copied');
          btn.innerHTML = '<i data-lucide="check"></i>';
          refreshIcons();
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i data-lucide="copy"></i>';
            refreshIcons();
          }, 1500);
        } catch {
          toast('Could not copy code', 'error');
        }
      } else if (action === 'regen') {
        const id = parseInt(msgId);
        if (!isNaN(id)) await regenerateMessage(id);
      } else if (action === 'delete') {
        const id = parseInt(msgId);
        await deleteMessage(isNaN(id) ? msgId : id);
      }
    });

    $('chat-list').addEventListener('click', async (e) => {
      const delBtn = e.target.closest('[data-del-id]');
      if (delBtn) {
        e.stopPropagation();
        await deleteChat(parseInt(delBtn.dataset.delId));
        return;
      }
      const item = e.target.closest('.chat-item');
      if (item) {
        await selectChat(parseInt(item.dataset.id));
        closeSidebar();
      }
    });
    $('chat-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.chat-item').forEach(item => {
        const title = item.querySelector('.chat-item-title').textContent.toLowerCase();
        item.style.display = title.includes(q) ? '' : 'none';
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('settings').classList.contains('open')) closeSettings();
        else if ($('sidebar').classList.contains('open')) closeSidebar();
        else if (!$('sysbar-edit').classList.contains('hidden')) toggleSysEditMode(false);
      }
    });
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
        e.preventDefault();
        createChat();
      }
    });
  }

  async function init() {
    loadSettings();
    setupEvents();
    refreshIcons();
    updateConnectionIndicator();
    const chatCount = await db.chats.count();
    if (chatCount === 0) {
      await createChat();
    } else {
      const chats = await db.chats.orderBy('updatedAt').reverse().toArray();
      await selectChat(chats[0].id);
      await loadChatList();
    }
    updateRequestPreview();
  }

  if (typeof marked !== 'undefined' && marked.setOptions) {
    marked.setOptions({
      breaks: true,
      gfm: true
    });
  }
  init();
  </script>

</body>

</html>
